workflow:
  rules:
    - if: '$GITLAB_CI == "false"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "trigger"'
    # Una sola pipeline per commit: sui branch la fa la merge request, non il
    # push. Senza MR aperta non parte nulla.
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

default:
  interruptible: true
  tags:
    - test

stages:
  - build
  - deploy
  - housekeeping
  - test

include:
  - local: 'gitlab/build.yml'
  - local: 'gitlab/deploy.yml'
  - local: 'gitlab/housekeeping.yml'
  - local: 'gitlab/test.yml'
