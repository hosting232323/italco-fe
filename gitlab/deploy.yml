# Deploy manuale su Cloudflare Pages (progetti direct upload hubstra-fe-test
# per deploy_test e hubstra-fe per deploy_prod). Sovrascrive sempre l'URL
# del progetto.
# Variabili CI richieste: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# VITE_HOSTNAME_TEST / VITE_GOOGLE_API_KEY_TEST e
# VITE_HOSTNAME_PROD / VITE_GOOGLE_API_KEY_PROD.
.deploy_pages:
  stage: deploy
  image: node:22
  needs: []
  interruptible: false

deploy_test:
  extends: .deploy_pages
  resource_group: hubstra-fe-test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
  script:
    - npm ci
    - VITE_HOSTNAME="$VITE_HOSTNAME_TEST" VITE_GOOGLE_API_KEY="$VITE_GOOGLE_API_KEY_TEST" npm run build
    - npx wrangler pages deploy dist --project-name=hubstra-fe-test --branch=main --commit-dirty=true
  environment:
    name: pages-test
    url: https://hubstra-fe-test.pages.dev

deploy_prod:
  extends: .deploy_pages
  resource_group: hubstra-fe
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
  script:
    - npm ci
    - VITE_HOSTNAME="$VITE_HOSTNAME_PROD" VITE_GOOGLE_API_KEY="$VITE_GOOGLE_API_KEY_PROD" npm run build
    - npx wrangler pages deploy dist --project-name=hubstra-fe --branch=main --commit-dirty=true
  environment:
    name: pages-prod
    url: https://hubstra-fe.pages.dev

# La demo usa un progetto Pages dedicato, distinto da test e produzione.
deploy_demo:
  extends: .deploy_pages
  resource_group: hubstra-fe-demo
  rules:
    - if: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "demo/pianificazione-automatica"'
      when: manual
      allow_failure: true
  script:
    - npm ci
    - VITE_HOSTNAME="$VITE_HOSTNAME_DEMO" VITE_GOOGLE_API_KEY="$VITE_GOOGLE_API_KEY_DEMO" npm run build
    - npx wrangler pages deploy dist --project-name=italco-fe-demo --branch=main --commit-dirty=true
  environment:
    name: pages-demo
    url: https://italco-fe-demo.pages.dev

# Rimozione manuale dei vecchi container Docker frontend rimasti sui runner
# server dai deploy precedenti a Pages. I nomi sono quelli del deploy storico.
cleanup_legacy_frontend_containers:
  stage: deploy
  interruptible: false
  tags:
    - "${SERVER_NAME}-deploy"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
  script:
    - |
      set -eu
      test -n "$PROJECT_NAME"
      docker rm -f "$PROJECT_NAME" "${PROJECT_NAME}-next" \
        "${PROJECT_NAME}-test" "${PROJECT_NAME}-test-next" 2>/dev/null || true
