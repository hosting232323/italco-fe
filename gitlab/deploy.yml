.deploy:
  stage: deploy
  interruptible: false
  tags:
    - "${SERVER_NAME}-deploy"
  script:
    - |
      set -eu

      if [ "$CI_JOB_NAME" = "deploy_test" ]; then
        CONTAINER_ACTIVE="${PROJECT_NAME}-test"
        CONTAINER_NEXT="${PROJECT_NAME}-test-next"
        FIRST_PORT="${PORT_TEST%%-*}"
        SECOND_PORT="${PORT_TEST#*-}"
        IMAGE_TAG="test-$CI_COMMIT_SHA"
      else
        CONTAINER_ACTIVE="${PROJECT_NAME}"
        CONTAINER_NEXT="${PROJECT_NAME}-next"
        FIRST_PORT="${PORT_PROD%%-*}"
        SECOND_PORT="${PORT_PROD#*-}"
        IMAGE_TAG="prod-$CI_COMMIT_SHA"
      fi

      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      IMAGE="$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      docker pull "$IMAGE"

      docker rm -f "${CONTAINER_NEXT}" 2>/dev/null || true

      docker run -d --name "${CONTAINER_NEXT}" \
        -p ${SECOND_PORT}:3000 \
        "$IMAGE"

      READY=0
      for _ in $(seq 1 30); do
        if curl -fs "http://localhost:${SECOND_PORT}" >/dev/null 2>&1; then
          READY=1; break
        fi
        sleep 2
      done

      if [ "${READY}" = "1" ]; then
        docker rm -f "${CONTAINER_ACTIVE}" 2>/dev/null || true

        docker run -d --restart unless-stopped \
          --name "${CONTAINER_ACTIVE}" \
          -p ${FIRST_PORT}:3000 \
          "$IMAGE"

        docker rm -f "${CONTAINER_NEXT}" 2>/dev/null || true
        echo "✅ Deploy completato con successo su ${CONTAINER_ACTIVE} (porta ${FIRST_PORT})"
      else
        echo "❌ Il nuovo container non è diventato pronto sulla porta ${SECOND_PORT}"
        docker logs "${CONTAINER_NEXT}" --tail 50 || true
        docker rm -f "${CONTAINER_NEXT}" 2>/dev/null || true
        exit 1
      fi

  after_script:
    - docker logout "$CI_REGISTRY" || true

deploy_test:
  extends: .deploy
  needs:
    - build_test
  when: manual

# Ambiente demo per i lavori lunghi (es. pianificazione automatica). Non usa le
# porte pubblicate come test/prod: il container sta sulla rete "web" e si
# registra da solo su Traefik con Host(demo.ares-logistics.it), esattamente come
# fa il backend. Serve solo il DNS del sottodominio verso Traefik, nessuna CI
# var e nessuna rotta da aggiungere a mano sul reverse proxy dell'host.
# Blue/green come il backend: il colore nuovo diventa attivo solo dopo che
# risponde, poi si rimuove il vecchio.
deploy_demo:
  extends: .deploy
  needs:
    - build_demo
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "demo/pianificazione-automatica"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "trigger"'
  variables:
    SERVICE: "${PROJECT_NAME}-demo"
    PUBLIC_HOST_PIPELINE: "demo.ares-logistics.it"
  script:
    - |
      set -eu

      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      IMAGE="$CI_REGISTRY_IMAGE:demo-$CI_COMMIT_SHA"
      docker pull "$IMAGE"

      if docker ps -q -f "name=^/${SERVICE}-blue$" | grep -q .; then
        CURRENT=blue; NEXT=green
      elif docker ps -q -f "name=^/${SERVICE}-green$" | grep -q .; then
        CURRENT=green; NEXT=blue
      else
        CURRENT=""; NEXT=blue
      fi
      echo "Colore attivo: ${CURRENT:-nessuno} -> nuovo: ${NEXT}"

      docker rm -f "${SERVICE}-${NEXT}" 2>/dev/null || true

      # "web" e' la rete condivisa creata da generic-deploy su cui gira Traefik
      # (--providers.docker.network=web, entrypoint "web" su :8080). La SPA sta
      # sulla radice: Host senza PathPrefix, l'/api dello stesso host lo prende
      # il router del backend che e' piu' specifico.
      docker run -d --restart unless-stopped \
        --name "${SERVICE}-${NEXT}" \
        --network web \
        --label "traefik.enable=true" \
        --label "traefik.http.routers.${SERVICE}-${NEXT}.rule=Host(\`${PUBLIC_HOST_PIPELINE}\`)" \
        --label "traefik.http.routers.${SERVICE}-${NEXT}.entrypoints=web" \
        --label "traefik.http.routers.${SERVICE}-${NEXT}.service=${SERVICE}" \
        --label "traefik.http.services.${SERVICE}.loadbalancer.server.port=3000" \
        --label "traefik.http.services.${SERVICE}.loadbalancer.healthcheck.path=/" \
        --label "traefik.http.services.${SERVICE}.loadbalancer.healthcheck.interval=5s" \
        --label "traefik.http.services.${SERVICE}.loadbalancer.healthcheck.timeout=3s" \
        "$IMAGE"

      READY=0
      for _ in $(seq 1 30); do
        if docker exec "${SERVICE}-${NEXT}" curl -fsS "http://localhost:3000/" >/dev/null 2>&1; then
          READY=1; break
        fi
        sleep 2
      done
      if [ "${READY}" != "1" ]; then
        echo "❌ Il nuovo container non è diventato pronto"
        docker logs "${SERVICE}-${NEXT}" --tail 50 || true
        docker rm -f "${SERVICE}-${NEXT}" || true
        exit 1
      fi

      if [ -n "${CURRENT}" ]; then
        docker rm -f "${SERVICE}-${CURRENT}" || true
      fi
      echo "✅ Deploy demo completato su ${SERVICE}-${NEXT} (Host: ${PUBLIC_HOST_PIPELINE})"

deploy_prod:
  extends: .deploy
  needs:
    - build_prod
  when: manual
  only:
    - main
