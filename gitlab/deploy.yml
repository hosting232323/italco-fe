.deploy:
  stage: deploy
  interruptible: false
  tags:
    - "${SERVER_NAME}-deploy"
  script:
    - |
      set -eu

      if [ "$CI_JOB_NAME" = "deploy_test" ]; then
        CONTAINER_ACTIVE="${PROJECT_NAME}-test"
        CONTAINER_NEXT="${PROJECT_NAME}-test-next"
        FIRST_PORT="${PORT_TEST%%-*}"
        SECOND_PORT="${PORT_TEST#*-}"
        IMAGE_TAG="test-$CI_COMMIT_SHA"
      elif [ "$CI_JOB_NAME" = "deploy_demo" ]; then
        CONTAINER_ACTIVE="${PROJECT_NAME}-demo"
        CONTAINER_NEXT="${PROJECT_NAME}-demo-next"
        FIRST_PORT="${PORT_DEMO%%-*}"
        SECOND_PORT="${PORT_DEMO#*-}"
        IMAGE_TAG="demo-$CI_COMMIT_SHA"
      else
        CONTAINER_ACTIVE="${PROJECT_NAME}"
        CONTAINER_NEXT="${PROJECT_NAME}-next"
        FIRST_PORT="${PORT_PROD%%-*}"
        SECOND_PORT="${PORT_PROD#*-}"
        IMAGE_TAG="prod-$CI_COMMIT_SHA"
      fi

      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      IMAGE="$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      docker pull "$IMAGE"

      docker rm -f "${CONTAINER_NEXT}" 2>/dev/null || true

      docker run -d --name "${CONTAINER_NEXT}" \
        -p ${SECOND_PORT}:3000 \
        "$IMAGE"

      READY=0
      for _ in $(seq 1 30); do
        if curl -fs "http://localhost:${SECOND_PORT}" >/dev/null 2>&1; then
          READY=1; break
        fi
        sleep 2
      done

      if [ "${READY}" = "1" ]; then
        docker rm -f "${CONTAINER_ACTIVE}" 2>/dev/null || true

        docker run -d --restart unless-stopped \
          --name "${CONTAINER_ACTIVE}" \
          -p ${FIRST_PORT}:3000 \
          "$IMAGE"

        docker rm -f "${CONTAINER_NEXT}" 2>/dev/null || true
        echo "✅ Deploy completato con successo su ${CONTAINER_ACTIVE} (porta ${FIRST_PORT})"
      else
        echo "❌ Il nuovo container non è diventato pronto sulla porta ${SECOND_PORT}"
        docker logs "${CONTAINER_NEXT}" --tail 50 || true
        docker rm -f "${CONTAINER_NEXT}" 2>/dev/null || true
        exit 1
      fi

  after_script:
    - docker logout "$CI_REGISTRY" || true

deploy_test:
  extends: .deploy
  needs:
    - build_test
  when: manual

# Ambiente demo per i lavori lunghi (es. pianificazione automatica): container
# e coppia di porte separate (PORT_DEMO, formato "primo-secondo" come PORT_TEST),
# cosi' il branch resta online per giorni senza toccare test.
deploy_demo:
  extends: .deploy
  needs:
    - build_demo
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "demo/pianificazione-automatica"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "trigger"'

deploy_prod:
  extends: .deploy
  needs:
    - build_prod
  when: manual
  only:
    - main
