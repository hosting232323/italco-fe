lint_frontend:
  stage: housekeeping
  image: node:22
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH != "main"'
  script:
    - npm ci
    - npx eslint "src/**/*.{js,vue}" "tests/**/*.js"

deps_check:
  stage: housekeeping
  image: node:22
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH != "main"'
  script:
    # node:22 imbarca un npm che chiama ancora l'endpoint /audits/quick, ormai
    # dismesso da npmjs.org (risposte 400/503): npm audit fallisce sempre,
    # a prescindere dalle vulnerabilita' reali. La versione nuova usa il
    # bulk endpoint che l'ha sostituito.
    - npm install -g npm@latest
    - npm ci --prefer-offline 2>/dev/null || npm ci
    - npm audit --audit-level=high || AUDIT_EXIT=$?
    - npm audit --audit-level=high --json > npm-audit-report.json || true
    - exit ${AUDIT_EXIT:-0}
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - npm-audit-report.json
